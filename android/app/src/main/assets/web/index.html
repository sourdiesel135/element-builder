<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TinyAmp Neural Audio Player</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Three.js Canvas Container -->
    <div id="canvas-container"></div>

    <!-- UI Overlay -->
    <div id="ui-overlay">
        <!-- Header -->
        <div id="header" class="ui-panel">
            <h1>🎵 TinyAmp Neural Audio Player</h1>
            <div class="status-bar">
                <span class="status-indicator" id="bridge-status">Bridge: Init...</span>
                <span class="status-indicator" id="audio-status">Audio: Idle</span>
                <span class="status-indicator" id="viz-status">Viz: Ready</span>
            </div>
        </div>

        <!-- Player Controls -->
        <div id="player-controls" class="ui-panel">
            <div class="now-playing">
                <div class="track-title" id="track-title">TinyAmp Neural</div>
                <div class="track-artist" id="track-artist">Explore consciousness through sound</div>
            </div>

            <div class="controls-row">
                <button class="btn" onclick="app.previousTrack()">⏮️ Prev</button>
                <button class="btn btn-primary" id="play-pause-btn" onclick="app.togglePlayback()">▶️ Play</button>
                <button class="btn" onclick="app.nextTrack()">⏭️ Next</button>
            </div>

            <div class="controls-row">
                <button class="btn btn-small" onclick="app.toggleSearch()">🔍 Search</button>
                <button class="btn btn-small" onclick="app.toggleSeyra()">🤖 Seyra</button>
                <button class="btn btn-small" onclick="app.shuffle()">🔀 Shuffle</button>
            </div>
        </div>

        <!-- Search Panel -->
        <div id="search-panel" class="ui-panel">
            <h3 style="color: #00FFFF; margin-bottom: 10px;">Archive.org Search</h3>
            <input type="text" class="search-input" id="search-input"
                   placeholder="Search for music..."
                   onkeypress="if(event.key==='Enter') app.search()">
            <button class="btn btn-small" onclick="app.search()">Search</button>
            <button class="btn btn-small" onclick="app.toggleSearch()">Close</button>
            <div class="search-results" id="search-results"></div>
        </div>

        <!-- Seyra AI Panel -->
        <div id="seyra-panel" class="ui-panel">
            <h3 style="color: #FF00FF; margin-bottom: 10px;">🤖 Seyra Consciousness</h3>
            <div class="chat-messages" id="chat-messages">
                <div class="chat-message seyra">
                    Hello, I'm Seyra. Let's explore consciousness through sound and resonance.
                </div>
            </div>
            <input type="text" class="chat-input" id="chat-input"
                   placeholder="Speak to Seyra..."
                   onkeypress="if(event.key==='Enter') app.sendToSeyra()">

            <div class="resonance-meter">
                <div class="meter-label">Neural Resonance</div>
                <div class="meter-bar">
                    <div class="meter-fill" id="resonance-fill"></div>
                </div>
            </div>

            <button class="btn btn-small" style="margin-top: 10px; width: 100%;"
                    onclick="app.toggleSeyra()">Close</button>
        </div>

        <!-- Visualizer Info (shown when idle) -->
        <div id="visualizer-info">
            <div class="viz-icon">◇</div>
            <div class="viz-text">Three.js Neural Visualizer Ready</div>
        </div>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Main Application Script -->
    <script src="app.js"></script>
</body>
</html>
