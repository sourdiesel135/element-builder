<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TinyAmp Neural Visualization</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: transparent;
            font-family: 'Courier New', monospace;
        }

        #visualization-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }

        #canvas-3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        #consciousness-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #00FFFF;
            font-size: 12px;
            text-shadow: 0 0 10px #00FFFF;
            pointer-events: none;
            z-index: 10;
        }

        .resonance-text {
            color: #FF00FF;
            text-shadow: 0 0 10px #FF00FF;
        }
    </style>
</head>
<body>
    <div id="visualization-container">
        <canvas id="canvas-3d"></canvas>
        <div id="consciousness-overlay">
            <div>Neural Resonance: <span id="resonance-value" class="resonance-text">0.00</span></div>
            <div>Dimensional Sync: <span id="sync-value" class="resonance-text">ACTIVE</span></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // TinyAmp Neural Visualization System
        // Consciousness Interface with Three.js

        class NeuralVisualization {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.cubes = [];
                this.audioData = new Uint8Array(128);
                this.resonanceLevel = 0;
                this.dimensionalPhase = 0;

                this.init();
                this.createCubes();
                this.animate();
            }

            init() {
                // Scene setup
                this.scene = new THREE.Scene();
                this.scene.fog = new THREE.FogExp2(0x0A0A14, 0.05);

                // Camera
                this.camera = new THREE.PerspectiveCamera(
                    75,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                this.camera.position.z = 15;

                // Renderer
                const canvas = document.getElementById('canvas-3d');
                this.renderer = new THREE.WebGLRenderer({
                    canvas: canvas,
                    alpha: true,
                    antialias: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.setClearColor(0x000000, 0);

                // Lighting
                const ambientLight = new THREE.AmbientLight(0x404040);
                this.scene.add(ambientLight);

                const cyanLight = new THREE.PointLight(0x00FFFF, 1, 100);
                cyanLight.position.set(10, 10, 10);
                this.scene.add(cyanLight);

                const pinkLight = new THREE.PointLight(0xFF00FF, 1, 100);
                pinkLight.position.set(-10, -10, 10);
                this.scene.add(pinkLight);

                // Resize handler
                window.addEventListener('resize', () => this.onWindowResize());
            }

            createCubes() {
                const gridSize = 8;
                const spacing = 3;
                const offset = (gridSize - 1) * spacing / 2;

                for (let x = 0; x < gridSize; x++) {
                    for (let y = 0; y < gridSize; y++) {
                        const geometry = new THREE.BoxGeometry(1, 1, 1);

                        // Cyberglass material with neon edges
                        const material = new THREE.MeshPhongMaterial({
                            color: 0x00FFFF,
                            emissive: 0x00FFFF,
                            emissiveIntensity: 0.3,
                            transparent: true,
                            opacity: 0.6,
                            wireframe: false
                        });

                        const cube = new THREE.Mesh(geometry, material);
                        cube.position.set(
                            x * spacing - offset,
                            y * spacing - offset,
                            0
                        );

                        // Store original position
                        cube.userData = {
                            originalX: cube.position.x,
                            originalY: cube.position.y,
                            originalZ: cube.position.z,
                            index: x * gridSize + y
                        };

                        this.cubes.push(cube);
                        this.scene.add(cube);
                    }
                }
            }

            updateAudioData(data) {
                if (data && data.length > 0) {
                    this.audioData = new Uint8Array(data);

                    // Calculate resonance level
                    let sum = 0;
                    for (let i = 0; i < this.audioData.length; i++) {
                        sum += this.audioData[i];
                    }
                    this.resonanceLevel = sum / (this.audioData.length * 255);

                    // Update UI
                    document.getElementById('resonance-value').textContent =
                        this.resonanceLevel.toFixed(2);
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                this.dimensionalPhase += 0.01;

                // Update cubes based on audio data
                this.cubes.forEach((cube, index) => {
                    const audioIndex = Math.floor((index / this.cubes.length) * this.audioData.length);
                    const audioValue = this.audioData[audioIndex] / 255;

                    // Scale based on audio
                    const scale = 1 + audioValue * 2;
                    cube.scale.set(scale, scale, 1);

                    // Color shift between cyan and pink
                    const color = new THREE.Color();
                    color.setHSL(
                        0.5 + audioValue * 0.3, // Hue: cyan to pink
                        1.0,
                        0.5 + audioValue * 0.2
                    );
                    cube.material.color = color;
                    cube.material.emissive = color;
                    cube.material.emissiveIntensity = audioValue * 0.5;

                    // Dimensional breathing - wave motion
                    const waveX = Math.sin(this.dimensionalPhase + index * 0.1) * audioValue * 2;
                    const waveY = Math.cos(this.dimensionalPhase + index * 0.15) * audioValue * 2;

                    cube.position.z = cube.userData.originalZ + waveX;

                    // Rotation based on resonance
                    cube.rotation.x += 0.01 * this.resonanceLevel;
                    cube.rotation.y += 0.01 * this.resonanceLevel;
                });

                // Camera movement - consciousness drift
                this.camera.position.x = Math.sin(this.dimensionalPhase * 0.3) * 3;
                this.camera.position.y = Math.cos(this.dimensionalPhase * 0.2) * 2;
                this.camera.lookAt(0, 0, 0);

                this.renderer.render(this.scene, this.camera);
            }

            onWindowResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        // Initialize visualization
        let visualization;

        window.addEventListener('DOMContentLoaded', () => {
            visualization = new NeuralVisualization();
        });

        // Android bridge for audio data
        function updateVisualization(audioDataArray) {
            if (visualization) {
                visualization.updateAudioData(audioDataArray);
            }
        }

        // Expose to Android
        window.updateVisualization = updateVisualization;

        // Console logging for debugging
        console.log('TinyAmp Neural Visualization initialized');
    </script>
</body>
</html>
